<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Reminder</title>
    <link rel="stylesheet" href="birthday.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Birthdays</h1>
            <button class="theme-toggle" id="themeToggle">☀️</button>
        </header>

        <div class="birthday-card">
            <div class="section-title">Upcoming Birthdays</div>
            <div id="upcomingBirthdays">
                <!-- Upcoming birthdays will be populated by JavaScript -->
            </div>
        </div>

        <div class="birthday-card">
            <div class="section-title">Past Birthdays</div>
            <div id="pastBirthdays">
                <!-- Past birthdays will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="birthday.js"></script>
</body>
</html>
