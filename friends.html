<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends | Social Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --bg-color: #f0f2f5;
            --text-color: #1c1e21;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --border-color: #dddfe2;
            --secondary-text: #65676b;
            --primary-color: #1877f2;
            --hover-color: #f0f2f5;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            --stat-bg: #f0f2f5;
        }
        
        .dark-mode {
            --bg-color: #18191a;
            --text-color: #e4e6eb;
            --card-bg: #242526;
            --header-bg: #242526;
            --border-color: #3e4042;
            --secondary-text: #b0b3b8;
            --primary-color: #2d88ff;
            --hover-color: #3a3b3c;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            --stat-bg: #3a3b3c;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: #456AD9;
            padding: 15px 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background-color 0.3s;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: var(--secondary-text);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.2s, color 0.2s;
        }
        
        .nav-links a:hover, .nav-links a.active {
            background-color: var(--hover-color);
            color: var(--primary-color);
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .dark-mode-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
            color: var(--secondary-text);
            transition: transform 0.3s;
        }
        
        .dark-mode-toggle:hover {
            transform: rotate(30deg);
        }
        
        .page-title {
            margin: 30px 0 20px;
            font-size: 28px;
            color: var(--text-color);
        }
        
        .friends-stats {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat-card {
            background-color: var(--stat-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: background-color 0.3s;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .stat-label {
            color: var(--secondary-text);
            font-size: 14px;
        }
        
        .section-title {
            font-size: 20px;
            margin: 25px 0 15px;
            color: var(--text-color);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .friends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .friend-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s;
        }
        
        .friend-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }
        
        .friend-avatar {
            width: 100%;
            height: 150px;
            background-color: var(--hover-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary-text);
            font-size: 40px;
            transition: background-color 0.3s;
        }
        
        .friend-info {
            padding: 15px;
        }
        
        .friend-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .friend-mutual {
            color: var(--secondary-text);
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .friend-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
            flex: 1;
            text-align: center;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #166fe5;
        }
        
        .btn-secondary {
            background-color: var(--hover-color);
            color: var(--text-color);
        }
        
        .btn-secondary:hover {
            background-color: #d8dadf;
        }
        
        .dark-mode .btn-secondary:hover {
            background-color: #4e4f50;
        }
        
        .requests-list {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s;
        }
        
        .request-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            transition: border-color 0.3s;
        }
        
        .request-item:last-child {
            border-bottom: none;
        }
        
        .request-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--hover-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary-text);
            font-size: 20px;
            margin-right: 15px;
            transition: background-color 0.3s;
        }
        
        .request-info {
            flex: 1;
        }
        
        .request-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .request-mutual {
            color: var(--secondary-text);
            font-size: 14px;
        }
        
        .request-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-success {
            background-color: #42b72a;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #36a420;
        }
        
        .btn-danger {
            background-color: var(--hover-color);
            color: var(--secondary-text);
        }
        
        .btn-danger:hover {
            background-color: #d8dadf;
        }
        
        .dark-mode .btn-danger:hover {
            background-color: #4e4f50;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            color: var(--text-color);
        }
        
        .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        /* Search Bar Styles */
        .search-container {
            position: relative;
            margin-bottom: 20px;
            max-width: 500px;
        }
        
        .search-bar {
            width: 100%;
            padding: 12px 45px 12px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .search-bar:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-text);
            pointer-events: none;
        }
        
        .search-results-info {
            margin-top: 10px;
            color: var(--secondary-text);
            font-size: 14px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--secondary-text);
        }
        
        @media (max-width: 768px) {
            .friends-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .header-content {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-links {
                width: 100%;
                justify-content: center;
            }
            
            .controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo" style="font-family:'Segoe Script', cursive; font-size:30px; color:#A4B569;">SocialNet</div> 
                <div class="nav-links">
                    <a href="dashboard.php">Home</a>
                    <a href="message.php">Messages</a>
                    <a href="Notification.php">Notifications</a>
                </div>
                <div class="user-profile">
                    <button class="dark-mode-toggle" id="darkModeToggle">🌙</button>
                    <div class="user-avatar">Dê</div>
                    <span>Dêstîñëë Dèstîñëë</span>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <h1 class="page-title">Friends</h1>
        
        <div class="friends-stats">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-friends">0</div>
                    <div class="stat-label">Friends</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pending-requests">0</div>
                    <div class="stat-label">Friend Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">15</div>
                    <div class="stat-label">Birthdays This Month</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">42</div>
                    <div class="stat-label">Recently Added</div>
                </div>
            </div>
        </div>
        
        <h2 class="section-title">Your Friends</h2>
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" class="search-bar" id="friendSearch" placeholder="Search friends by name...">
            <div class="search-icon">🔍</div>
            <div class="search-results-info" id="searchResultsInfo"></div>
        </div>
        
        <div class="controls">
            <button class="filter-btn active" data-filter="all">All Friends</button>
        </div>
        
        <div class="friends-grid" id="friends-container">
            <!-- Friends will be dynamically added here -->
        </div>
        
        <h2 class="section-title">Friend Requests</h2>
        
        <div class="requests-list" id="requests-container">
            <!-- Friend requests will be dynamically added here -->
        </div>
    </div>

    <script>
        const friendsData = [
            { id: 1, name: "Bongani Zulu", mutual: 15, initials: "BZ" },
            { id: 2, name: "Thandiwe Ndlovu", mutual: 8, initials: "TN" },
            { id: 3, name: "Sipho Mthembu", mutual: 22, initials: "SM" },
            { id: 4, name: "Nomvula Khumalo", mutual: 5, initials: "NK" },
            { id: 5, name: "Jabulani Dlamini", mutual: 18, initials: "JD" },
            { id: 6, name: "Nokuthula Mbatha", mutual: 11, initials: "NM" },
            { id: 7, name: "Tendai Moyo", mutual: 7, initials: "TM" },
            { id: 8, name: "Farai Chiweshe", mutual: 12, initials: "FC" },
            { id: 9, name: "Rumbidzai Marufu", mutual: 9, initials: "RM" },
            { id: 10, name: "Tatenda Ndlovu", mutual: 14, initials: "TN" },
            { id: 11, name: "Anesu Mashava", mutual: 6, initials: "AM" },
            { id: 12, name: "Kudakwashe Mupfumi", mutual: 3, initials: "KM" }
        ];

        const requestsData = [
            { id: 101, name: "Nkosiyabo Zulu", mutual: 4, initials: "NZ", origin: "work" },
            { id: 102, name: "Nomathemba Nkosi", mutual: 7, initials: "NN", origin: "school" },
            { id: 103, name: "Munashe Shumba", mutual: 2, initials: "MS", origin: "mutual" },
            { id: 104, name: "Rufaro Muchenje", mutual: 9, initials: "RM", origin: "work" }
        ];

        // DOM elements
        const friendsContainer = document.getElementById('friends-container');
        const requestsContainer = document.getElementById('requests-container');
        const totalFriendsElement = document.getElementById('total-friends');
        const pendingRequestsElement = document.getElementById('pending-requests');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const friendSearch = document.getElementById('friendSearch');
        const searchResultsInfo = document.getElementById('searchResultsInfo');

        // Current filter state
        let currentFilter = 'all';
        let currentSearchTerm = '';

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            renderFriends('all');
            renderFriendRequests();
            setupDarkMode();
            setupSearch();
            setupFilters();
        });

        // Update statistics
        function updateStats() {
            totalFriendsElement.textContent = friendsData.length;
            pendingRequestsElement.textContent = requestsData.length;
        }

        // Setup search functionality
        function setupSearch() {
            friendSearch.addEventListener('input', function() {
                currentSearchTerm = this.value.toLowerCase().trim();
                applyFiltersAndSearch();
            });
        }

        // Setup filter buttons
        function setupFilters() {
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Remove active class from all buttons
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    // Update current filter
                    currentFilter = this.getAttribute('data-filter');
                    
                    // Apply filters and search
                    applyFiltersAndSearch();
                });
            });
        }

        // Apply both filter and search
        function applyFiltersAndSearch() {
            let filteredFriends = friendsData;
            
            // Apply origin filter
            if (currentFilter !== 'all') {
                filteredFriends = filteredFriends.filter(friend => friend.origin === currentFilter);
            }
            
            // Apply search filter
            if (currentSearchTerm) {
                filteredFriends = filteredFriends.filter(friend => 
                    friend.name.toLowerCase().includes(currentSearchTerm)
                );
            }
            
            // Update search results info
            updateSearchResultsInfo(filteredFriends.length);
            
            // Render the filtered friends
            renderFilteredFriends(filteredFriends);
        }

        // Update search results information
        function updateSearchResultsInfo(resultCount) {
            if (currentSearchTerm) {
                if (resultCount === 0) {
                    searchResultsInfo.textContent = `No friends found for "${currentSearchTerm}"`;
                } else {
                    searchResultsInfo.textContent = `Found ${resultCount} friend${resultCount !== 1 ? 's' : ''} for "${currentSearchTerm}"`;
                }
            } else {
                searchResultsInfo.textContent = '';
            }
        }

        // Render filtered friends
        function renderFilteredFriends(filteredFriends) {
            friendsContainer.innerHTML = '';
            
            if (filteredFriends.length === 0) {
                friendsContainer.innerHTML = `
                    <div class="no-results">
                        <p>No friends found with the selected criteria.</p>
                        <p>Try adjusting your search or filter.</p>
                    </div>
                `;
                return;
            }
            
            filteredFriends.forEach(friend => {
                const friendCard = document.createElement('div');
                friendCard.className = 'friend-card';
                friendCard.innerHTML = `
                    <div class="friend-avatar">${friend.initials}</div>
                    <div class="friend-info">
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-mutual">${friend.mutual} mutual friends</div>
                        <div class="friend-actions">
                            <button class="btn btn-primary">Message</button>
                            <button class="btn btn-secondary" onclick="removeFriend(${friend.id})">Unfriend</button>
                        </div>
                    </div>
                `;
                friendsContainer.appendChild(friendCard);
            });
        }

        // Render friends based on filter (legacy function)
        function renderFriends(filter) {
            currentFilter = filter;
            applyFiltersAndSearch();
        }

        // Render friend requests
        function renderFriendRequests() {
            requestsContainer.innerHTML = '';
            
            if (requestsData.length === 0) {
                requestsContainer.innerHTML = '<p>No pending friend requests.</p>';
                return;
            }
            
            requestsData.forEach(request => {
                const requestItem = document.createElement('div');
                requestItem.className = 'request-item';
                requestItem.innerHTML = `
                    <div class="request-avatar">${request.initials}</div>
                    <div class="request-info">
                        <div class="request-name">${request.name}</div>
                        <div class="request-mutual">${request.mutual} mutual friends</div>
                    </div>
                    <div class="request-actions">
                        <button class="btn btn-success" onclick="acceptRequest(${request.id})">Confirm</button>
                        <button class="btn btn-danger" onclick="declineRequest(${request.id})">Delete</button>
                    </div>
                `;
                requestsContainer.appendChild(requestItem);
            });
        }

        // Setup dark mode
        function setupDarkMode() {
            // Check for saved theme preference or default to light
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                darkModeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                darkModeToggle.textContent = '🌙';
            }
            
            // Toggle dark mode
            darkModeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    darkModeToggle.textContent = '☀️';
                } else {
                    localStorage.setItem('theme', 'light');
                    darkModeToggle.textContent = '🌙';
                }
            });
        }

        // Friend management functions
        function removeFriend(friendId) {
            if (confirm('Are you sure you want to remove this friend?')) {
                const index = friendsData.findIndex(friend => friend.id === friendId);
                if (index !== -1) {
                    friendsData.splice(index, 1);
                    updateStats();
                    applyFiltersAndSearch();
                }
            }
        }

        function acceptRequest(requestId) {
            const index = requestsData.findIndex(request => request.id === requestId);
            if (index !== -1) {
                const newFriend = requestsData[index];
                friendsData.push(newFriend);
                requestsData.splice(index, 1);
                updateStats();
                renderFriendRequests();
                applyFiltersAndSearch();
                alert(`You are now friends with ${newFriend.name}!`);
            }
        }

        function declineRequest(requestId) {
            const index = requestsData.findIndex(request => request.id === requestId);
            if (index !== -1) {
                const declinedRequest = requestsData[index];
                requestsData.splice(index, 1);
                updateStats();
                renderFriendRequests();
                alert(`Friend request from ${declinedRequest.name} has been declined.`);
            }
        }
    </script>
</body>
</html>
